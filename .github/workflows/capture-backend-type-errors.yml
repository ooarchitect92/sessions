name: Capture backend type diagnostics

on:
  push:
    branches:
      - feature/identity-workspaces-foundation-20261002
    paths:
      - ".github/workflows/capture-backend-type-errors.yml"

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture compiler output
        shell: bash
        run: |
          set -uo pipefail
          cp .env.example .env
          npm install --no-audit --no-fund
          npm run db:generate
          mkdir -p .ci-diagnostics
          set +e
          npm run lint --workspace @sessions/backend > .ci-diagnostics/backend-type-errors.txt 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> .ci-diagnostics/backend-type-errors.txt
          rm -f .github/workflows/capture-backend-type-errors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture backend type diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
