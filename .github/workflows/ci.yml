name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run format
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run ai:eval
      - run: npm run build
      - name: Package validated source
        if: always()
        run: >-
          tar
          --exclude=.git
          --exclude=node_modules
          --exclude='*/dist'
          --exclude=coverage
          --exclude=.env
          -czf /tmp/sessions-validated-source.tar.gz .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sessions-validated-source
          path: /tmp/sessions-validated-source.tar.gz
          if-no-files-found: error
          retention-days: 3

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: sessions
          POSTGRES_USER: sessions
          POSTGRES_PASSWORD: sessions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sessions -d sessions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
      MIGRATION_DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate
