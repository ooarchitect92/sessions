name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run ai:eval
      - run: npm run build
      - name: Package validated source
        if: always()
        run: >-
          tar
          --exclude=.git
          --exclude=node_modules
          --exclude='*/dist'
          --exclude=coverage
          --exclude=.env
          -czf /tmp/sessions-validated-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessions-validated-source
          path: /tmp/sessions-validated-source.tar.gz
          if-no-files-found: error
          retention-days: 3

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
      MIGRATION_DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare PostgreSQL with pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-16 build-essential
          sudo systemctl start postgresql.service
          rm -rf /tmp/pgvector
          git clone --depth 1 --branch v0.8.7 https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector OPTFLAGS="" with_llvm=no
          sudo make -C /tmp/pgvector install with_llvm=no
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='sessions'" | grep -q 1; then
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sessions LOGIN PASSWORD 'sessions' SUPERUSER"
          fi
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='sessions'" | grep -q 1; then
            sudo -u postgres createdb -O sessions sessions
          fi
      - run: cp .env.example .env
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate
