name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sessions
          POSTGRES_USER: sessions
          POSTGRES_PASSWORD: sessions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sessions -d sessions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
      MIGRATION_DATABASE_URL: postgresql://sessions:sessions@localhost:5432/sessions?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate
