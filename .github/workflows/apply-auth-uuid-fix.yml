name: Apply auth UUID type correction

on:
  push:
    branches:
      - feature/identity-workspaces-foundation-20261002
    paths:
      - ".github/workflows/apply-auth-uuid-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UUID parameter types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/auth/auth.service.ts')
          source = path.read_text()
          old = "    familyId = randomUUID(),\n    sessionId = randomUUID(),"
          new = "    familyId: string = randomUUID(),\n    sessionId: string = randomUUID(),"
          if old not in source:
              raise SystemExit('issueTokens UUID parameters were not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -rf .ci-diagnostics
          rm -f .github/workflows/apply-auth-uuid-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: type auth token identifiers as strings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
