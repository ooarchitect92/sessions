name: Apply identity implementation payload

on:
  push:
    branches:
      - feature/identity-workspaces-foundation-20261002
    paths:
      - ".implementation-payload/**"
      - ".github/workflows/apply-identity-payload.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .implementation-payload/part-* | base64 --decode > /tmp/identity-changes.tgz
          printf '2fdb9aab20cb52b62e94d633a845bf8aa865940804ae58d996b8640b194686cd  /tmp/identity-changes.tgz\n' | sha256sum -c -
          tar -xzf /tmp/identity-changes.tgz
          rm -rf .implementation-payload
          rm -f .github/workflows/apply-identity-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add identity and workspace control plane"
          git push origin "HEAD:${GITHUB_REF_NAME}"
