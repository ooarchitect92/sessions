name: Apply auth type fixes

on:
  push:
    branches:
      - feature/identity-workspaces-foundation-20261002
    paths:
      - ".github/workflows/apply-auth-type-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authentication service
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/auth/auth.service.ts')
          source = path.read_text()

          method_start = source.index('  async completeMfa(')
          transaction_start = source.index(
              '    const result = await this.prisma.$transaction(async (transaction) => {',
              method_start,
          )
          verified_if = source.index('      if (!verified) {', transaction_start)

          challenge_block = """    const challengeId = claims.challengeId as string;
              const challengeUserId = claims.sub as string;

              const result = await this.prisma.$transaction(async (transaction) => {
                await transaction.$executeRaw`SELECT pg_advisory_xact_lock(hashtextextended(${challengeId}, 0))`;
                const challenge = await transaction.authChallenge.findUnique({
                  where: { id: challengeId },
                  include: {
                    user: true,
                    workspace: { include: { organization: true } },
                  },
                });
                const factor = challenge
                  ? await transaction.userMfaFactor.findUnique({
                      where: { userId: challenge.userId },
                    })
                  : null;
                if (
                  !challenge ||
                  challenge.userId !== challengeUserId ||
                  challenge.purpose !== AuthChallengePurpose.MFA_LOGIN ||
                  challenge.consumedAt ||
                  challenge.expiresAt <= new Date() ||
                  challenge.attempts >= MAX_LOGIN_ATTEMPTS ||
                  !factor?.verifiedAt ||
                  factor.disabledAt
                ) {
                  return { error: 'invalid_challenge' } as const;
                }

                const verified = await this.verifyMfaCode(transaction, factor, input.code);
          """
          source = source[:transaction_start] + challenge_block + source[verified_if:]

          result_start = source.index("    if ('bundle' in result) return result.bundle;", method_start)
          method_end = source.index('  }\n\n  async refresh(', result_start)
          result_block = """    if ('bundle' in result) return result.bundle;
              const error = 'error' in result ? result.error : 'invalid_challenge';
              if (error === 'workspace_access') {
                throw new ForbiddenException('Workspace access is no longer available');
              }
              throw new UnauthorizedException(
                error === 'invalid_code'
                  ? 'The MFA code is invalid'
                  : 'The MFA challenge is invalid or expired',
              );
          """
          source = source[:result_start] + result_block + source[method_end:]

          recovery_method = source.index('  private async verifyMfaCode(')
          hashes_start = source.index(
              '    const hashes = Array.isArray(factor.recoveryCodeHashes)',
              recovery_method,
          )
          candidate_start = source.index('    const candidate =', hashes_start)
          hashes_block = """    const rawHashes: unknown = factor.recoveryCodeHashes;
              const hashes = Array.isArray(rawHashes)
                ? rawHashes.filter((value): value is string => typeof value === 'string')
                : [];
          """
          source = source[:hashes_start] + hashes_block + source[candidate_start:]

          old_data = '      data: { recoveryCodeHashes: hashes },'
          if old_data not in source:
              raise SystemExit('Recovery-code update statement was not found')
          source = source.replace(
              old_data,
              '      data: { recoveryCodeHashes: hashes as Prisma.InputJsonValue },',
              1,
          )

          path.write_text(source)
          PY

          rm -f .github/workflows/apply-auth-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tighten authentication type handling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
