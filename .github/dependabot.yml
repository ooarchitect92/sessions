version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      livekit:
        patterns: ["livekit-*", "@livekit/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "supertest", "@testing-library/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
