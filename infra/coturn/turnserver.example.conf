# Optional external TURN example. The default local Compose stack does not start coturn.
# Replace every placeholder, add TLS, and use a secret store before production.
listening-port=3478
fingerprint
lt-cred-mech
realm=sessions.local
user=sessions:sessions-turn-local
no-multicast-peers
no-cli
stale-nonce=600
min-port=49160
max-port=49200
verbose
