name: sessions

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sessions
      POSTGRES_USER: sessions
      POSTGRES_PASSWORD: sessions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessions -d sessions"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 2; done &&
      mc mb --ignore-existing local/sessions-local &&
      mc anonymous set private local/sessions-local
      "

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  egress:
    image: livekit/egress:v1.12.0
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  migrate-and-seed:
    image: sessions-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sessions_migrator:sessions_migrator@postgres:5432/sessions?schema=public
      MIGRATION_DATABASE_URL: postgresql://sessions_migrator:sessions_migrator@postgres:5432/sessions?schema=public
    command:
      - /bin/sh
      - -c
      - >-
        ./node_modules/.bin/tsx backend/scripts/migrate.ts &&
        DATABASE_URL=postgresql://sessions_worker:sessions_worker@postgres:5432/sessions?schema=public ./node_modules/.bin/tsx backend/prisma/seed.ts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: sessions-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sessions_api:sessions_api@postgres:5432/sessions?schema=public
      WORKER_DATABASE_URL: postgresql://sessions_worker:sessions_worker@postgres:5432/sessions?schema=public
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_EGRESS_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      UPLOAD_SCAN_PROVIDER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    ports:
      - "4000:4000"
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      egress:
        condition: service_started
      clamav:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/v1
        VITE_AUTH_MODE: development
        VITE_DEV_ORGANIZATION_ID: 11111111-1111-4111-8111-111111111111
        VITE_DEV_WORKSPACE_ID: 22222222-2222-4222-8222-222222222222
        VITE_DEV_USER_ID: 33333333-3333-4333-8333-333333333333
        VITE_DEV_USER_EMAIL: owner@sessions.local
    ports:
      - "3000:80"
    depends_on:
      - api

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
      args:
        VITE_APP_URL: http://localhost:3000
        VITE_API_URL: http://localhost:4000/v1
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
