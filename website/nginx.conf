server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Dynamic public product journeys are hydrated client-side against the API.
  location ^~ /events/ {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }

  location ^~ /book/ {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }

  # Marketing and resource routes are generated at build time. Resolve their
  # route-specific index files without redirecting canonical paths to a slash.
  # Unknown routes remain real 404s rather than silently serving the homepage.
  location / {
    try_files $uri/index.html $uri =404;
    add_header Cache-Control "no-store";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-store";
  }
}
